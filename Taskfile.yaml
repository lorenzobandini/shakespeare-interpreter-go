version: '3'

tasks:
  fmt:
    desc: Format source code and organize imports
    cmds:
      - gofmt -s -w .
      - goimports -w .

  lint:
    desc: Run static analysis with golangci-lint
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Check for vulnerabilities in dependencies
    cmds:
      - govulncheck ./...

  test:
    desc: Run the test suite with race detection and coverage reporting
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...

  check:
    desc: Run all quality gates before committing
    deps: [fmt, lint, vuln, test]
    cmds:
      - echo "All checks passed successfully!"

  build:
    desc: Compile the interpreter executable for Windows
    deps: [fmt]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "unknown"
    cmds:
      - cmd: go build -ldflags="-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o bin/shpl.exe cmd/shpl/main.go

  docker:build:
    desc: Build the minimal runtime Docker image
    cmds:
      - docker build -t shpl:latest .

  docker:check:
    desc: Run the full quality gate suite inside the container
    cmds:
      - docker build --target=check -t shpl:check .
